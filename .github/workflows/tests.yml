name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      tags:
        description: 'Cucumber tag expression (e.g. @api, @ui, @smoke, not @performance)'
        required: false
        default: ''
  schedule:
    # Every Monday at 09:00 Montevideo time (12:00 UTC) to catch changes in the live API/site
    - cron: '0 12 * * 1'

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Download dependencies
        run: mvn -B -q test-compile

      - name: Install Playwright browser
        run: >
          mvn -B -q exec:java
          -Dexec.mainClass=com.microsoft.playwright.CLI
          -Dexec.classpathScope=test
          -Dexec.args="install --with-deps chromium"

      - name: Run tests
        env:
          TAGS: ${{ github.event.inputs.tags }}
        run: |
          if [ -n "$TAGS" ]; then
            mvn -B test -Dcucumber.filter.tags="$TAGS"
          else
            mvn -B test
          fi

      - name: Upload Cucumber report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cucumber-report
          path: target/cucumber-reports/
          retention-days: 14
